<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ViStatic</title>

    <script src="vendor/vue.global.js"></script>
    <link rel="stylesheet" href="vendor/bulma.min.css">

    <link href="vendor/videojs/video-js.css" rel="stylesheet" />
    <script src="vendor/videojs/video.min.js"></script>
    <link href="vendor/videojs/index.css" rel="stylesheet" />

    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/clipboard.min.js"></script>

    <script src="vistatic.js"></script>

    <style>
        .video-js {
            max-height: 80vh !important;
        }

        .video-js video {
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div id="app" style="min-height:100vh; background: #f9f9f9;">
        <div class="container py-4">
            <div class="is-flex is-flex-direction-column is-align-items-center" style="gap:1rem;">

                <div class="has-text-centered">
                    <video ref="videoPlayer" class="video-js" style="border-radius:0.75rem;" controls></video>
                </div>

                <div class="box" style="width:100%;" v-if="item">
                    <div class="is-flex is-flex-direction-row is-justify-content-space-between" style="gap:1rem">
                        <p class="title">{{item.get_title()}}</p>
                        <div class="dropdown is-hoverable is-right">
                            <div class="dropdown-trigger">
                                <button class="button" aria-haspopup="true" aria-controls="dropdown-menu">
                                    <span class="icon is-small">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-share" viewBox="0 0 16 16">
                                            <path
                                                d="M13.5 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.5 2.5 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5m-8.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m11 5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3" />
                                        </svg>
                                    </span>
                                    <span>Share</span>
                                </button>
                            </div>
                            <div class="dropdown-menu" id="dropdown-menu" role="menu">
                                <div class="dropdown-content">
                                    <button class="button dropdown-item" id="copylink">
                                        <span class="icon is-small">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16">
                                                <path fill-rule="evenodd"
                                                    d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z" />
                                            </svg>
                                        </span>
                                        <span>Copy link</span>
                                    </button>
                                    <button class="button dropdown-item" id="copylinktime">
                                        <span class="icon is-small">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                fill="currentColor" class="bi bi-clock" viewBox="0 0 16 16">
                                                <path
                                                    d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z" />
                                                <path
                                                    d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0" />
                                            </svg>
                                        </span>
                                        <span>Copy link with time</span>
                                    </button>
                                    <button class="button dropdown-item" id="copyiframe">
                                        <span class="icon is-small">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                fill="currentColor" class="bi bi-code-slash" viewBox="0 0 16 16">
                                                <path
                                                    d="M10.478 1.647a.5.5 0 1 0-.956-.294l-4 13a.5.5 0 0 0 .956.294zM4.854 4.146a.5.5 0 0 1 0 .708L1.707 8l3.147 3.146a.5.5 0 0 1-.708.708l-3.5-3.5a.5.5 0 0 1 0-.708l3.5-3.5a.5.5 0 0 1 .708 0m6.292 0a.5.5 0 0 0 0 .708L14.293 8l-3.147 3.146a.5.5 0 0 0 .708.708l3.5-3.5a.5.5 0 0 0 0-.708l-3.5-3.5a.5.5 0 0 0-.708 0" />
                                            </svg>
                                        </span>
                                        <span>Copy embedded code</span>
                                    </button>
                                    <button class="button dropdown-item" id="copyiframetime">
                                        <span class="icon is-small">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                fill="currentColor" class="bi bi-code-slash" viewBox="0 0 16 16">
                                                <path
                                                    d="M10.478 1.647a.5.5 0 1 0-.956-.294l-4 13a.5.5 0 0 0 .956.294zM4.854 4.146a.5.5 0 0 1 0 .708L1.707 8l3.147 3.146a.5.5 0 0 1-.708.708l-3.5-3.5a.5.5 0 0 1 0-.708l3.5-3.5a.5.5 0 0 1 .708 0m6.292 0a.5.5 0 0 0 0 .708L14.293 8l-3.147 3.146a.5.5 0 0 0 .708.708l3.5-3.5a.5.5 0 0 0 0-.708l-3.5-3.5a.5.5 0 0 0-.708 0" />
                                            </svg>
                                        </span>
                                        <span>Copy embedded code with time</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card" style="width:100%;" v-if="item">
                    <div class="card-content">
                        <div class="content">
                            <div v-html="md_to_html(item.get_description())"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function getEmbedIframe(ratio, time, item_id) {
            return `
<!-- change following line width to change size -->
<div style="position: relative; width: 100%; aspect-ratio: ${ratio};">
    <iframe src="embed.html?collection_id=${item_id}&time=${time}"
        style="position: absolute; top:0; left:0; width:100%; height:100%; border:0;" allowFullScreen="true"
        scrolling="no" webkitallowfullscreen="true" mozallowfullscreen="true" frameborder="0">
    </iframe>
</div>`;
        }

        function parseDuration(str) {
            const regex = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/;
            const match = str.match(regex);

            // Must match AND contain at least one unit
            if (!match || (!match[1] && !match[2] && !match[3])) {
                return 0;
            }

            const hours = parseInt(match[1] || 0, 10);
            const minutes = parseInt(match[2] || 0, 10);
            const seconds = parseInt(match[3] || 0, 10);

            return hours * 3600 + minutes * 60 + seconds;
        }
    </script>

    <script>
        const { createApp, ref, watch, onMounted, useTemplateRef } = Vue

        let app = {
            setup() {
                const item = ref(null);
                const videoPlayer = useTemplateRef("videoPlayer");
                let player = null;
                let collection_id = null;

                onMounted(() => {
                    player = videojs(videoPlayer.value, {
                        controls: true
                    });
                });

                const clipboard_link = new ClipboardJS('#copylink', {
                    text: function () {
                        const url = new URL(window.location.href);
                        url.searchParams.delete("time");
                        return url.href;
                    }
                });
                const clipboard_link_time = new ClipboardJS('#copylinktime', {
                    text: function () {
                        const time = parseInt(player.currentTime());
                        const url = new URL(window.location.href);
                        url.searchParams.set("time", `${time}s`);
                        return url.href;
                    }
                });
                const clipboard_iframe = new ClipboardJS('#copyiframe', {
                    text: function () {
                        const videoWidth = player.videoWidth();
                        const videoHeight = player.videoHeight();
                        const ratio = videoWidth / videoHeight;
                        const time = parseInt(player.currentTime());
                        return getEmbedIframe(ratio, `${time}s`, collection_id);
                    }
                });
                const clipboard_iframe_time = new ClipboardJS('#copyiframetime', {
                    text: function () {
                        const videoWidth = player.videoWidth();
                        const videoHeight = player.videoHeight();
                        const ratio = videoWidth / videoHeight;
                        return getEmbedIframe(ratio, '0s', collection_id);
                    }
                });

                [clipboard_link, clipboard_link_time, clipboard_iframe, clipboard_iframe_time].forEach((c) => {
                    c.on('success', function (event) {
                        event.clearSelection();
                    });
                    c.on('error', function (event) {
                        console.error('Copy failed', event);
                    });
                });

                function md_to_html(content) {
                    return marked.parse(content)
                }

                let urlParams = new URLSearchParams(window.location.search);

                if (urlParams.has('collection_id')) {
                    collection_id = urlParams.get('collection_id');

                    collection_factory('collection.json').then(res => {
                        item.value = res.find((e) => e.get_id() === collection_id)
                        player.src(item.value.get_video());
                        player.load();
                        if (urlParams.has('time')) {
                            player.currentTime(parseDuration(urlParams.get('time')));
                        }
                    });
                }

                return { item, md_to_html }
            }
        }

        const v_app = createApp(app);
        v_app.mount('#app');
    </script>
</body>

</html>
